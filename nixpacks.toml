# Nixpacks configuration for deploying SvelteKit static site to Coolify
# Based on working wp_eins configuration

buildImage = 'ghcr.io/railwayapp/nixpacks:latest'

[phases.setup]
npm = true
nodeVersion = "20"

[phases.install]
dependsOn = ["setup"]
cacheDirectories = [
  "node_modules",
  "node_modules/.cache"]
cmds = ["corepack enable", "corepack prepare pnpm@latest --activate", "pnpm install --frozen-lockfile"]

[phases.build]
dependsOn = ["install"]
cacheDirectories = [
  "node_modules",
  "node_modules/.cache"]
cmds = ["pnpm run build"]

[phases.start]
cmd = "node serve.js"

# Ensure build directory is included in the final image
[staticAssets]
"build" = "build"

[variables]
PORT = "3000"